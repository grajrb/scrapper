# Search / filter / scoring configuration.
# Tuned for the 2026-2027 target profile:
#   SDE2 / Data Analyst / GenAI Engineer, 30-50 LPA, Oct 2027
# Tune freely - every value below is plain YAML.

roles:
  - software engineer
  - sde
  - backend engineer
  - full stack engineer
  - software developer
  - data analyst
  - senior data analyst
  - data engineer
  - genai engineer
  - generative ai engineer
  - ml engineer
  - machine learning engineer

locations:
  - Bangalore
  - Bengaluru
  - Hyderabad
  - Chennai
  - Mumbai
  - Gurgaon
  - Pune
  - Remote

countries: []              # empty = any country

# Alternate spellings so "Gurugram" matches "Gurgaon" etc.
location_aliases:
  Bangalore: [Bengaluru]
  Bengaluru: [Bangalore]
  Mumbai: [Bombay]
  Bombay: [Mumbai]
  Gurgaon: [Gurugram]
  Gurugram: [Gurgaon]
  Delhi: [New Delhi]
  Bombay: [Mumbai]

remote_preference: any     # any | prefer | require | onsite

experience_min: 3
experience_max: 6

skills:
  - Python
  - Node.js
  - React
  - SQL
  - Azure

preferred_skills:
  - GenAI
  - RAG
  - LLM
  - FastAPI
  - Microservices
  - Power BI

excluded_keywords:
  - internship
  - director
  - vice president

employment_types:
  - full_time
  - contract

industries: []             # reserved for Phase 5 (jobs carry no industry field yet)

minimum_match_score: 50    # below this a job is stored but not counted as relevant
high_match_score: 75       # used for reports and the "High Match" export sheet

scoring:
  weights:                 # must total 100 for a 0-100 score
    title: 30
    skills: 30
    experience: 20
    location: 15
    employment_type: 5
  # How to score a component whose data is missing from the posting:
  #   neutral = half credit + warning (default), zero = 0 + warning, full = full credit + warning
  unknown_field_policy: neutral

filtering:
  skill_match_mode: any    # any = at least min_skill_matches, all = every required skill
  min_skill_matches: 1
  excluded_keyword_fields: [title]   # title and/or description
  require_target_company: true       # drop jobs that do not belong to a target company
  new_status_days: 7                 # keep status NEW this long after first_seen
  inactive_after_days: 14            # mark jobs INACTIVE if not seen for this long

